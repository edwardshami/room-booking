    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style type="text/tailwindcss">
    @layer theme {
        :root {
            --primary: #0ea5e9;
            --primary-dark: #0284c7;
            --bg-color: #f8fafc;
            --text-main: #0f172a;
        }
    }
    @layer base {
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
        }
    }
    @layer components {
        .btn {
            @apply px-4 py-2 rounded-lg font-medium transition-colors duration-200 flex items-center justify-center gap-2;
        }
        .btn-primary {
            @apply bg-[var(--primary)] text-white hover:bg-[var(--primary-dark)];
        }
        .btn-outline {
            @apply border border-[var(--primary)] text-[var(--primary)] hover:bg-sky-50;
        }
        .input-field {
            @apply w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[var(--primary)] focus:border-transparent outline-none transition-all;
        }
        .card {
            @apply bg-white rounded-xl shadow-sm border border-gray-100 p-6;
        }
    }
    </style>
</head>
<body>
    <div id="root"></div>
    <!-- تم تعديل السكربت هنا ليصبح type="module" -->

    <script type="text/babel" src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(err => console.log('SW config error', err));
            });
        }
    </script>
</body>
</html>
